<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart type switcher (Chart.js)</title>

<style>
:root{--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;--border:rgba(11,11,11,.12);--border-strong:rgba(11,11,11,.3);--surface-0:#ffffff;--surface-1:#f5f4f0;--surface-2:#ffffff;--bg-accent:#dbeafe;--text-accent:#1d4ed8;--text-danger:#b91c1c;--radius:8px;--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){:root{--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#898781;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.3);--surface-0:#1a1a19;--surface-1:#242422;--surface-2:#2c2c2a;--bg-accent:#1e3a5f;--text-accent:#93c5fd;--text-danger:#fca5a5}}
body{font-family:var(--font-sans);background:var(--surface-0);color:var(--text-primary);max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 1.25rem}
button{font:inherit;font-size:14px;border:.5px solid var(--border-strong);background:transparent;color:var(--text-primary);padding:6px 14px;border-radius:var(--radius);cursor:pointer}
button:hover{background:var(--surface-1)}
input[type=range]{accent-color:#2a78d6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg text{fill:var(--text-primary);font-family:var(--font-sans)}
.t{font-size:14px}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:500}
.node{cursor:pointer}.node:hover{opacity:.8}
.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}
@media (prefers-color-scheme: dark){.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}}
</style>
<script>window.sendPrompt=function(t){console.log('sendPrompt (chat only):',t);};</script>
</head><body>
<h1>Chart type switcher (Chart.js)</h1>

<div style="display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;">
  <button id="b-line">Line</button><button id="b-bar">Bar</button><button id="b-scatter">Scatter</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:8px;font-size:12px;color:var(--text-secondary);">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#2a78d6;"></span>n</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#1baf7a;"></span>n log n</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#eb6834;"></span>n squared</span>
</div>
<div style="position:relative;width:100%;height:280px;"><canvas id="cv" role="img" aria-label="Chart comparing n, n log n and n squared for n from 1 to 8"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
var xs=[1,2,3,4,5,6,7,8];
var f=[function(n){return n;},function(n){return +(n*Math.log2(n)).toFixed(2);},function(n){return n*n;}];
var cols=['#2a78d6','#1baf7a','#eb6834'],names=['n','n log n','n squared'];
var dark=matchMedia('(prefers-color-scheme: dark)').matches;
var tick='#898781',grid=dark?'#2c2c2a':'#e1e0d9',chart;
function ds(t){return f.map(function(g,i){
  var o={label:names[i],borderColor:cols[i],backgroundColor:cols[i]};
  if(t==='scatter'){o.data=xs.map(function(n){return{x:n,y:g(n)};});o.pointRadius=5;}
  else{o.data=xs.map(g);}
  if(t==='line'){o.tension=0.3;o.borderWidth=2;o.pointRadius=3;}
  if(t==='bar'){o.borderRadius=3;}
  return o;});}
function draw(t){
  if(chart){chart.destroy();}
  chart=new Chart(document.getElementById('cv'),{type:t,data:{labels:xs,datasets:ds(t)},options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},
    plugins:{legend:{display:false}},
    scales:{x:{type:t==='scatter'?'linear':'category',title:{display:true,text:'n',color:tick},grid:{display:false},ticks:{color:tick},border:{color:grid}},
            y:{title:{display:true,text:'operations',color:tick},grid:{color:grid},ticks:{color:tick},border:{display:false}}}}});
}
document.getElementById('b-line').onclick=function(){draw('line');};
document.getElementById('b-bar').onclick=function(){draw('bar');};
document.getElementById('b-scatter').onclick=function(){draw('scatter');};
draw('line');
})();
</script>
</body></html>

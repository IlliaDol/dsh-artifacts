<!doctype html>
<html lang="en" data-artifact="Wobble check">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Wobble check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f4f2ed; --surface-3:#ece8df;
  --text:#141413; --text-2:#52514e; --muted:#8a8782; --border:#e4e0d7; --border-strong:#cfc9bd;
  --accent:#d97757; --accent-ink:#8a3b22; --accent-wash:#f7e6df;
  --ok:#1baf7a; --warn:#eda100; --danger:#d03b3b;
  --radius:8px; --radius-card:12px; --radius-lg:16px;
  --font-sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace;
  --shadow:0 1px 2px rgba(20,20,19,.04),0 8px 24px rgba(20,20,19,.05);
  --maxw:720px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413; --surface:#1c1c1a; --surface-2:#232321; --surface-3:#2c2c29;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8a8782; --border:#33332f; --border-strong:#484841;
    --accent:#e08a6c; --accent-ink:#f3c6b4; --accent-wash:#3a241d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1c1c1a; --surface-2:#232321; --surface-3:#2c2c29;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8a8782; --border:#33332f; --border-strong:#484841;
  --accent:#e08a6c; --accent-ink:#f3c6b4; --accent-wash:#3a241d;
}
:root[data-theme="light"]{
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f4f2ed; --surface-3:#ece8df;
  --text:#141413; --text-2:#52514e; --muted:#8a8782; --border:#e4e0d7; --border-strong:#cfc9bd;
  --accent:#d97757; --accent-ink:#8a3b22; --accent-wash:#f7e6df;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:transparent; color:var(--text);
  font-family:var(--font-sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-serif); font-weight:600; line-height:1.15; letter-spacing:-.01em; margin:0 0 .5em}
h1{font-size:30px} h2{font-size:23px} h3{font-size:18px} h4{font-size:16px; font-family:var(--font-sans); font-weight:600}
p{margin:0 0 1em}
a{color:var(--accent-ink); text-underline-offset:2px}
code{font-family:var(--font-mono); font-size:.88em; background:var(--surface-2); padding:.15em .4em; border-radius:4px}
pre{font-family:var(--font-mono); font-size:13px; line-height:1.6; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; overflow:auto}
pre code{background:none; padding:0}
hr{border:0; border-top:1px solid var(--border); margin:24px 0}
table{border-collapse:collapse; width:100%; font-size:14px; margin:0 0 1.2em}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top}
th{font-weight:600; color:var(--text-2); font-size:12px; letter-spacing:.04em; text-transform:uppercase}
blockquote{margin:0 0 1.2em; padding:2px 0 2px 16px; border-left:2px solid var(--accent); color:var(--text-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:var(--maxw); margin:0 auto; padding:24px 20px 32px}
.muted{color:var(--text-2)} small{color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px 18px; box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border)}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
.metric{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px}
.metric .label{font-size:12px; color:var(--text-2); margin:0 0 4px}
.metric .value{font-size:26px; font-weight:600; line-height:1.1; margin:0; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--text-2); margin:0 0 10px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:10px; height:10px; border-radius:2px; display:inline-block}
.chart-wrap{position:relative; width:100%; height:300px}
details.data{margin-top:10px; font-size:12px; color:var(--text-2)}
details.data summary{cursor:pointer; color:var(--text-2)}
button{font:inherit; font-size:14px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:var(--radius); padding:7px 12px; cursor:pointer}
button:hover{background:var(--surface-2)}
button.primary{background:var(--text); color:var(--bg); border-color:var(--text)}
input,select,textarea{font:inherit; font-size:14px; color:var(--text); background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius); padding:7px 10px}
input[type=range]{padding:0; accent-color:var(--accent)}

body{background:transparent}

.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:0 0 10px}
.card-head h3{margin:0; font-size:19px}
.meta{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:12px; color:var(--text-2); margin:0 0 14px}
.rows{display:flex; flex-direction:column; gap:8px}
.row{display:flex; gap:12px; align-items:baseline; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0; padding-bottom:0}
.row .primary{flex:1; min-width:0}
.row .secondary{color:var(--text-2); font-size:14px; white-space:nowrap}
ol.steps-list,ul.plain{margin:0; padding-left:20px}
ol.steps-list li,ul.plain li{margin:0 0 6px}
.option{border:1px solid var(--border); border-radius:var(--radius-card); padding:12px 14px; background:var(--surface); display:flex; gap:10px; align-items:flex-start; cursor:pointer}
.option:hover{background:var(--surface-2)}
.option.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--surface))}
.option.wrong{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 9%, var(--surface))}
.option input{margin:3px 0 0; accent-color:var(--accent)}
.explain{font-size:13px; color:var(--text-2); margin:8px 0 0}
.score{font-size:13px; color:var(--text-2)}
.compare{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px}
.compare .card h4{margin:0 0 2px; font-size:16px}
.compare .price{font-size:22px; font-weight:600; margin:4px 0 10px; font-variant-numeric:tabular-nums}
.compare dl{margin:0; font-size:13px}
.compare dt{color:var(--muted); margin-top:8px; font-size:11px; text-transform:uppercase; letter-spacing:.04em}
.compare dd{margin:1px 0 0}
.quote{font-family:var(--font-serif); font-size:20px; line-height:1.45; margin:0 0 10px}
.days{display:flex; flex-direction:column; gap:12px}
.day{border-left:2px solid var(--border-strong); padding-left:14px}
.day h4{margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-2); font-family:var(--font-sans)}
.stop{display:flex; gap:10px; font-size:14px; margin:0 0 6px}
.stop time{color:var(--muted); font-variant-numeric:tabular-nums; min-width:52px}
.message{white-space:pre-wrap; font-size:15px; line-height:1.65}
.forecast{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:8px; margin-top:12px}
.forecast div{text-align:center; background:var(--surface-2); border-radius:var(--radius); padding:8px 4px}
.forecast .day-name{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.forecast .temps{font-size:13px; font-variant-numeric:tabular-nums}
.temp{font-size:44px; font-weight:600; line-height:1; font-family:var(--font-serif)}

.quiz-actions{display:flex; align-items:center; gap:10px; margin-top:12px}

</style>
</head>
<body>
<div class="wrap" style="padding:6px 0 4px"><div id="quiz" data-questions="[{&quot;question&quot;:&quot;Which band is ±1 wobble?&quot;,&quot;options&quot;:[&quot;2.95–7.39%&quot;,&quot;4.06–6.28%&quot;],&quot;answer&quot;:1,&quot;explanation&quot;:&quot;±1 is the dark inner band.&quot;},{&quot;question&quot;:&quot;The dot sits at 4.75%. Is that inside ±1?&quot;,&quot;options&quot;:[&quot;Yes&quot;,&quot;No&quot;],&quot;answer&quot;:0,&quot;explanation&quot;:&quot;4.75 is between 4.06 and 6.28.&quot;}]">
<div class="card-head"><h3>Wobble check</h3><span class="score" id="quiz-score"></span></div>
<div class="card" data-question="0" style="margin-bottom:12px">
<h4 style="margin:0 0 10px;font-family:var(--font-sans);font-size:15px">1. Which band is ±1 wobble?</h4>
<div class="rows"><label class="option"><input type="radio" name="q0" value="0"><span>2.95–7.39%</span></label><label class="option"><input type="radio" name="q0" value="1"><span>4.06–6.28%</span></label></div>
<p class="explain" hidden>±1 is the dark inner band.</p>

</div><div class="card" data-question="1" style="margin-bottom:12px">
<h4 style="margin:0 0 10px;font-family:var(--font-sans);font-size:15px">2. The dot sits at 4.75%. Is that inside ±1?</h4>
<div class="rows"><label class="option"><input type="radio" name="q1" value="0"><span>Yes</span></label><label class="option"><input type="radio" name="q1" value="1"><span>No</span></label></div>
<p class="explain" hidden>4.75 is between 4.06 and 6.28.</p>

</div>
<div class="quiz-actions"><button id="quiz-reset">Reset</button><span class="muted" style="font-size:12px">Scored in the card — nothing is sent to the model</span></div>
</div></div>
<script>
(function(){
  var root = document.getElementById('quiz');
  if (!root) return;
  var questions = JSON.parse(root.dataset.questions);
  var score = 0, answered = 0;
  root.addEventListener('change', function(event){
    var input = event.target.closest('input[type=radio]');
    if (!input) return;
    var card = input.closest('[data-question]');
    var index = Number(card.dataset.question);
    var question = questions[index];
    if (card.dataset.done === '1') return;
    card.dataset.done = '1';
    answered += 1;
    var correct = Number(input.value) === Number(question.answer);
    if (correct) score += 1;
    card.querySelectorAll('.option').forEach(function(option){
      var value = Number(option.querySelector('input').value);
      option.classList.toggle('correct', value === Number(question.answer));
      option.classList.toggle('wrong', value === Number(input.value) && !correct);
      option.querySelector('input').disabled = true;
    });
    var explain = card.querySelector('.explain');
    if (explain) explain.hidden = false;
    var out = document.getElementById('quiz-score');
    if (out) out.textContent = score + ' / ' + answered + ' correct';
  });
  var reset = document.getElementById('quiz-reset');
  if (reset) reset.addEventListener('click', function(){
    score = 0; answered = 0;
    root.querySelectorAll('[data-question]').forEach(function(card){
      delete card.dataset.done;
      card.querySelectorAll('.option').forEach(function(option){ option.classList.remove('correct','wrong'); });
      card.querySelectorAll('input').forEach(function(input){ input.checked = false; input.disabled = false; });
      var explain = card.querySelector('.explain'); if (explain) explain.hidden = true;
    });
    var out = document.getElementById('quiz-score'); if (out) out.textContent = '';
  });
})();
</script>
<script>
(function(){
  var root = document.documentElement;
  function post(message){ try { if (parent !== window) parent.postMessage(message, '*'); } catch (e) {} }
  function theme(){ try { var t = new URLSearchParams(location.search).get('theme'); if (t) root.dataset.theme = t; } catch (e) {} }
  theme();
  addEventListener('message', function(event){
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'dsh-artifact:theme' && (data.theme === 'light' || data.theme === 'dark')) root.dataset.theme = data.theme;
  });
  function height(){
    var body = document.body;
    if (!body) return;
    var value = Math.max(body.scrollHeight, root.scrollHeight);
    post({ type: 'dsh-artifact:height', height: value });
  }
  if ('ResizeObserver' in window) new ResizeObserver(height).observe(document.body);
  addEventListener('load', height);
  setTimeout(height, 60); setTimeout(height, 300);
  var api = {
    send: function(action, payload){ post({ type: 'dsh-artifact:action', action: String(action), payload: payload || {} }); },
    prompt: function(text){ post({ type: 'dsh-artifact:prompt', text: String(text) }); },
    open: function(url){ post({ type: 'dsh-artifact:open', url: String(url) }); },
    state: {
      get: function(key){ try { return JSON.parse(localStorage.getItem('dsh-artifact:' + key) || 'null'); } catch (e) { return null; } },
      set: function(key, value){ try { localStorage.setItem('dsh-artifact:' + key, JSON.stringify(value)); } catch (e) {} }
    }
  };
  window.dshArtifact = api;
  window.dsh = api;
})();
</script>
</body>
</html>

<head>

<title>Sampling designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f4f2ed; --surface-3:#ece8df;
  --text:#141413; --text-2:#52514e; --muted:#8a8782; --border:#e4e0d7; --border-strong:#cfc9bd;
  --accent:#d97757; --accent-ink:#8a3b22; --accent-wash:#f7e6df;
  --ok:#1baf7a; --warn:#eda100; --danger:#d03b3b;
  --radius:8px; --radius-card:12px; --radius-lg:16px;
  --font-sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace;
  --shadow:0 1px 2px rgba(20,20,19,.04),0 8px 24px rgba(20,20,19,.05);
  --maxw:720px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413; --surface:#1c1c1a; --surface-2:#232321; --surface-3:#2c2c29;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8a8782; --border:#33332f; --border-strong:#484841;
    --accent:#e08a6c; --accent-ink:#f3c6b4; --accent-wash:#3a241d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1c1c1a; --surface-2:#232321; --surface-3:#2c2c29;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8a8782; --border:#33332f; --border-strong:#484841;
  --accent:#e08a6c; --accent-ink:#f3c6b4; --accent-wash:#3a241d;
}
:root[data-theme="light"]{
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f4f2ed; --surface-3:#ece8df;
  --text:#141413; --text-2:#52514e; --muted:#8a8782; --border:#e4e0d7; --border-strong:#cfc9bd;
  --accent:#d97757; --accent-ink:#8a3b22; --accent-wash:#f7e6df;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:transparent; color:var(--text);
  font-family:var(--font-sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-serif); font-weight:600; line-height:1.15; letter-spacing:-.01em; margin:0 0 .5em}
h1{font-size:30px} h2{font-size:23px} h3{font-size:18px} h4{font-size:16px; font-family:var(--font-sans); font-weight:600}
p{margin:0 0 1em}
a{color:var(--accent-ink); text-underline-offset:2px}
code{font-family:var(--font-mono); font-size:.88em; background:var(--surface-2); padding:.15em .4em; border-radius:4px}
pre{font-family:var(--font-mono); font-size:13px; line-height:1.6; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; overflow:auto}
pre code{background:none; padding:0}
hr{border:0; border-top:1px solid var(--border); margin:24px 0}
table{border-collapse:collapse; width:100%; font-size:14px; margin:0 0 1.2em}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top}
th{font-weight:600; color:var(--text-2); font-size:12px; letter-spacing:.04em; text-transform:uppercase}
blockquote{margin:0 0 1.2em; padding:2px 0 2px 16px; border-left:2px solid var(--accent); color:var(--text-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:var(--maxw); margin:0 auto; padding:24px 20px 32px}
.muted{color:var(--text-2)} small{color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px 18px; box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border)}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
.metric{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px}
.metric .label{font-size:12px; color:var(--text-2); margin:0 0 4px}
.metric .value{font-size:26px; font-weight:600; line-height:1.1; margin:0; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--text-2); margin:0 0 10px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:10px; height:10px; border-radius:2px; display:inline-block}
.chart-wrap{position:relative; width:100%; height:300px}
details.data{margin-top:10px; font-size:12px; color:var(--text-2)}
details.data summary{cursor:pointer; color:var(--text-2)}
button{font:inherit; font-size:14px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:var(--radius); padding:7px 12px; cursor:pointer}
button:hover{background:var(--surface-2)}
button.primary{background:var(--text); color:var(--bg); border-color:var(--text)}
input,select,textarea{font:inherit; font-size:14px; color:var(--text); background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius); padding:7px 10px}

body{background:transparent}
/* Shared surface for the gallery and the DSH widget. Tokens first, so a host
   can override them and every chart follows without a second stylesheet. */

:root {
  --vz-text: #1b1b19;
  --vz-dim: #5f5e5a;
  --vz-faint: #8a8782;
  --vz-line: #e4e2da;
  --vz-surface: #ffffff;
  --vz-page: #f7f6f2;
  --vz-accent: #2a78d6;
  --vz-radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --vz-text: #ecebe6;
    --vz-dim: #b5b3aa;
    --vz-faint: #8b897f;
    --vz-line: #35342f;
    --vz-surface: #1c1c1a;
    --vz-page: #141413;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--vz-page);
  color: var(--vz-text);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Everything is selectable. A visualisation is a document, not an image. */
body, body * {
  user-select: text;
  -webkit-user-select: text;
}

a { color: var(--vz-accent); }

.vz-wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 96px;
}

.vz-head h1 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}

.vz-head p {
  color: var(--vz-dim);
  margin: 0 0 22px;
  max-width: 62ch;
}

.vz-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 0 0 26px;
  position: sticky;
  top: 0;
  padding: 12px 0;
  background: color-mix(in srgb, var(--vz-page) 88%, transparent);
  backdrop-filter: blur(8px);
  z-index: 5;
}

.vz-chip, .vz-button {
  font: inherit;
  font-size: 12px;
  padding: 5px 11px;
  border-radius: 999px;
  border: 1px solid var(--vz-line);
  background: var(--vz-surface);
  color: var(--vz-dim);
  cursor: pointer;
  transition: border-color .12s ease, color .12s ease, background .12s ease;
}

.vz-chip:hover, .vz-button:hover { color: var(--vz-text); border-color: var(--vz-dim); }
.vz-chip[aria-pressed="true"] { background: var(--vz-text); color: var(--vz-surface); border-color: var(--vz-text); }
.vz-button { border-radius: 7px; }

.vz-search {
  font: inherit;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--vz-line);
  background: var(--vz-surface);
  color: var(--vz-text);
  min-width: 200px;
}

.vz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  gap: 20px;
}

@media (max-width: 520px) {
  .vz-grid { grid-template-columns: 1fr; }
  .vz-wrap { padding: 24px 14px 64px; }
}

.vz-card {
  background: var(--vz-surface);
  border: 1px solid var(--vz-line);
  border-radius: var(--vz-radius);
  padding: 18px 18px 14px;
  min-width: 0;
  content-visibility: auto;
  contain-intrinsic-size: 420px;
}

.vz-card > h2 {
  font-size: 15px;
  font-weight: 500;
  margin: 0 0 2px;
}

.vz-card > .vz-when {
  color: var(--vz-dim);
  font-size: 12.5px;
  margin: 0 0 16px;
  max-width: 60ch;
}

.vz-plot { min-height: 120px; }

.vz-code {
  margin: 14px 0 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--vz-text) 5%, var(--vz-surface));
  color: var(--vz-dim);
  font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, monospace;
  font-size: 11.5px;
  line-height: 1.5;
  overflow: auto;
  max-height: 320px;
  white-space: pre;
  tab-size: 2;
}

.vz-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}

.vz-family {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--vz-faint);
  margin: 0 0 6px;
}

/* The same tokens the kit reads, expressed for a host that already has a theme. */
[data-vz="widget"] {
  --vz-text: var(--dsw-alias-label-primary, #1b1b19);
  --vz-dim: var(--dsw-alias-label-secondary, #5f5e5a);
  --vz-faint: var(--dsw-alias-label-tertiary, #8a8782);
  --vz-line: var(--dsw-alias-border-l2, #e4e2da);
  --vz-surface: var(--dsw-alias-bg-layer-1, #fff);
  --vz-page: transparent;
}

:root{--vz-text:var(--text);--vz-dim:var(--text-2);--vz-faint:var(--muted);--vz-line:var(--border);--vz-surface:var(--surface);--vz-accent:var(--accent);--grid:var(--border);--axis:var(--border-strong);--card:var(--surface-2)}
#recipe{width:100%}#recipe svg{display:block;max-width:100%;height:auto}#recipe canvas{display:block;max-width:100%}
</style>

<body>
<div class="wrap" style="padding:6px 0 4px">
<h2 class="sr-only">Sampling designs explainer: Show why simple random, stratified and cluster sampling all land on the truth but not with the same precision.</h2>
<div id="recipe"></div>
</div>
<script>/* viz-kit.js: the small toolkit every recipe uses.
   Idea: a chart is just (1) scales that map data to pixels, (2) marks (SVG shapes), (3) axes.
   Nothing here draws a whole chart; recipes compose these primitives. */
(function (root) {
  const NS = 'http://www.w3.org/2000/svg';
  const K = {};

  // Fixed categorical palette (never cycled past 8)
  K.C = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];

  // ---- SVG building blocks -------------------------------------------------
  K.el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  K.text = (parent, x, y, s, attrs) => {
    const t = K.el('text', Object.assign({ x, y, 'font-size': 11, fill: 'var(--muted,#898781)' }, attrs || {}), parent);
    t.textContent = s;
    return t;
  };
  K.path = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join('');

  // ---- Scales: data value -> pixel ----------------------------------------
  K.linear = (d0, d1, r0, r1) => {
    const f = v => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
    f.domain = [d0, d1];
    return f;
  };
  K.band = (keys, r0, r1, pad = 0.2) => {
    const step = (r1 - r0) / keys.length, bw = step * (1 - pad);
    const f = k => r0 + keys.indexOf(k) * step + (step - bw) / 2;
    f.bw = bw; f.step = step;
    return f;
  };
  K.ticks = (lo, hi, n = 5) => {
    let st = (hi - lo) / n;
    const p = Math.pow(10, Math.floor(Math.log10(st))), m = st / p;
    st = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
    const out = [];
    for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) out.push(+v.toFixed(6));
    return out;
  };
  K.range = (lo, hi, n) => Array.from({ length: n }, (_, i) => lo + (hi - lo) * i / (n - 1));

  // ---- Stage + axes --------------------------------------------------------
  K.stage = (host, w = 320, h = 220, m = {}) => {
    m = Object.assign({ t: 10, r: 12, b: 28, l: 40 }, m);
    const svg = K.el('svg', { viewBox: `0 0 ${w} ${h}`, width: '100%', role: 'img' });
    host.appendChild(svg);
    const g = K.el('g', { transform: `translate(${m.l},${m.t})` }, svg);
    return { svg, g, W: w - m.l - m.r, H: h - m.t - m.b, m };
  };
  K.axisY = (st, y, n = 4, fmt = v => v) => {
    const [a, b] = y.domain;
    K.ticks(Math.min(a, b), Math.max(a, b), n).forEach(v => {
      K.el('line', { x1: 0, x2: st.W, y1: y(v), y2: y(v), stroke: 'var(--grid,#e1e0d9)', 'stroke-width': 0.5 }, st.g);
      K.text(st.g, -6, y(v) + 4, fmt(v), { 'text-anchor': 'end' });
    });
  };
  K.axisX = (st, x, n = 5, fmt = v => v) => {
    const [a, b] = x.domain;
    K.ticks(Math.min(a, b), Math.max(a, b), n).forEach(v => K.text(st.g, x(v), st.H + 16, fmt(v), { 'text-anchor': 'middle' }));
  };
  K.axisBand = (st, x, keys) =>
    keys.forEach(k => K.text(st.g, x(k) + x.bw / 2, st.H + 16, k, { 'text-anchor': 'middle' }));

  // ---- Geometry for circular charts ---------------------------------------
  K.polar = (cx, cy, r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)]; // angle 0 = 12 o'clock, clockwise
  K.arc = (cx, cy, r0, r1, a0, a1) => {
    const big = a1 - a0 > Math.PI ? 1 : 0;
    const p0 = K.polar(cx, cy, r1, a0), p1 = K.polar(cx, cy, r1, a1);
    const p2 = K.polar(cx, cy, r0, a1), p3 = K.polar(cx, cy, r0, a0);
    return `M${p0}A${r1} ${r1} 0 ${big} 1 ${p1}L${p2}A${r0} ${r0} 0 ${big} 0 ${p3}Z`;
  };

  // ---- Statistics ----------------------------------------------------------
  K.sum = a => a.reduce((s, x) => s + x, 0);
  K.mean = a => K.sum(a) / a.length;
  K.sd = a => { const m = K.mean(a); return Math.sqrt(K.sum(a.map(x => (x - m) ** 2)) / (a.length - 1)); };
  K.sorted = a => a.slice().sort((p, q) => p - q);
  K.quantile = (s, q) => { const i = (s.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi] - s[lo]) * (i - lo); };
  K.hist = (data, lo, hi, k) => {
    const w = (hi - lo) / k;
    const bins = Array.from({ length: k }, (_, i) => ({ x0: lo + i * w, x1: lo + (i + 1) * w, n: 0 }));
    data.forEach(v => { bins[Math.min(k - 1, Math.max(0, Math.floor((v - lo) / w)))].n++; });
    return bins;
  };
  K.bw = data => 1.06 * K.sd(data) * Math.pow(data.length, -0.2);            // Silverman's rule
  K.kde = (data, bw, xs) => xs.map(x =>
    K.sum(data.map(d => Math.exp(-0.5 * ((x - d) / bw) ** 2))) / (data.length * bw * Math.sqrt(2 * Math.PI)));
  K.invNorm = p => {                                                          // Abramowitz-Stegun 26.2.23
    const f = q => { const t = Math.sqrt(-2 * Math.log(q)); return t - (2.515517 + 0.802853 * t + 0.010328 * t * t) / (1 + 1.432788 * t + 0.189269 * t * t + 0.001308 * t ** 3); };
    return p < 0.5 ? -f(p) : f(1 - p);
  };

  // ---- Reproducible fake data (seeded, so every run looks the same) -------
  K.rng = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  K.normal = r => { const u = r() || 1e-9, v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  K.sample = (seed, n, mu, sd) => { const r = K.rng(seed); return Array.from({ length: n }, () => mu + sd * K.normal(r)); };
  K.data = { langs: [['Python', 68], ['SQL', 57], ['R', 41], ['Java', 29], ['Julia', 12]] };

  // ---- Show a recipe's source as readable text -----------------------------
  K.codeOf = fn => {
    const lines = fn.toString().replace(/^fn\s*\(/, 'function draw(').split('\n');
    const base = lines[lines.length - 1].match(/^\s*/)[0].length;
    return lines.map((l, i) => (i ? l.slice(base) : l)).join('\n');
  };

  // ======================= batch 2+ helpers =======================
  // ---- Colour ramps ---------------------------------------------------------
  K.hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  K.mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  K.rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.seq = t => K.rgb(K.mix(K.hex('#e8f1fc'), K.hex('#1f4e9c'), K.clamp(t, 0, 1)));               // light -> dark blue
  K.div = t => t < 0.5 ? K.rgb(K.mix(K.hex('#e34948'), K.hex('#f4f3ee'), t * 2)) : K.rgb(K.mix(K.hex('#f4f3ee'), K.hex('#2a78d6'), (t - 0.5) * 2)); // t in 0..1
  // ---- Curves and legends -----------------------------------------------------
  K.curve = pts => {                                   // Catmull-Rom spline converted to cubic Beziers
    if (pts.length < 3) return K.path(pts);
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += `C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
    }
    return d;
  };
  K.legend = (parent, items, x, y, gap = 70) => items.forEach(([name, col], i) => {
    K.el('rect', { x: x + i * gap, y, width: 10, height: 10, rx: 2, fill: col }, parent);
    K.text(parent, x + i * gap + 14, y + 9, name);
  });
  // ---- Regression -----------------------------------------------------------
  K.lin = (xs, ys) => {
    const n = xs.length, mx = K.mean(xs), my = K.mean(ys);
    let sxx = 0, sxy = 0; xs.forEach((x, i) => { sxx += (x - mx) ** 2; sxy += (x - mx) * (ys[i] - my); });
    const b = sxy / sxx, a = my - b * mx;
    const s = Math.sqrt(K.sum(xs.map((x, i) => (ys[i] - a - b * x) ** 2)) / (n - 2));
    return { n, mx, my, sxx, a, b, s };
  };
  K.corr = (xs, ys) => { const mx = K.mean(xs), my = K.mean(ys); let c = 0, p = 0, q = 0; xs.forEach((x, i) => { c += (x - mx) * (ys[i] - my); p += (x - mx) ** 2; q += (ys[i] - my) ** 2; }); return c / Math.sqrt(p * q); };
  // ---- Hierarchies ------------------------------------------------------------
  K.sumTree = n => { if (n.children) n.value = K.sum(n.children.map(K.sumTree)); return n.value; };
  K.squarify = (items, x, y, w, h) => {                // squarified treemap (Bruls et al.)
    const total = K.sum(items.map(i => i.value)), k = w * h / total, out = [];
    let rest = items.map(i => ({ item: i, a: i.value * k })), rx = x, ry = y, rw = w, rh = h;
    const worst = (row, side) => { const s = K.sum(row.map(r => r.a)); return Math.max(side * side * Math.max(...row.map(r => r.a)) / (s * s), s * s / (side * side * Math.min(...row.map(r => r.a)))); };
    while (rest.length) {
      const side = Math.min(rw, rh), row = [rest[0]]; let i = 1;

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowchart: data science pipeline</title>

<style>
:root{--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;--border:rgba(11,11,11,.12);--border-strong:rgba(11,11,11,.3);--surface-0:#ffffff;--surface-1:#f5f4f0;--surface-2:#ffffff;--bg-accent:#dbeafe;--text-accent:#1d4ed8;--text-danger:#b91c1c;--radius:8px;--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){:root{--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#898781;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.3);--surface-0:#1a1a19;--surface-1:#242422;--surface-2:#2c2c2a;--bg-accent:#1e3a5f;--text-accent:#93c5fd;--text-danger:#fca5a5}}
body{font-family:var(--font-sans);background:var(--surface-0);color:var(--text-primary);max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.6}
h1{font-size:22px;font-weight:500;margin:0 0 1.25rem}
button{font:inherit;font-size:14px;border:.5px solid var(--border-strong);background:transparent;color:var(--text-primary);padding:6px 14px;border-radius:var(--radius);cursor:pointer}
button:hover{background:var(--surface-1)}
input[type=range]{accent-color:#2a78d6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg text{fill:var(--text-primary);font-family:var(--font-sans)}
.t{font-size:14px}.ts{font-size:12px;fill:var(--text-secondary)}.th{font-size:14px;font-weight:500}
.node{cursor:pointer}.node:hover{opacity:.8}
.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}
@media (prefers-color-scheme: dark){.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}}
</style>
<script>window.sendPrompt=function(t){console.log('sendPrompt (chat only):',t);};</script>
</head><body>
<h1>Flowchart: data science pipeline</h1>

<svg width="100%" viewBox="0 0 680 150" role="img">
<title>Data science project flowchart</title>
<desc>Five steps in a row: collect, clean, explore, model, evaluate, with a note that the loop repeats.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-teal" onclick="sendPrompt('How do I collect data for a data science project?')"><rect x="40" y="40" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="90" y="62" text-anchor="middle" dominant-baseline="central">Collect</text></g>
<g class="node c-teal" onclick="sendPrompt('How do I clean data with pandas?')"><rect x="165" y="40" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="215" y="62" text-anchor="middle" dominant-baseline="central">Clean</text></g>
<g class="node c-teal" onclick="sendPrompt('What is exploratory data analysis?')"><rect x="290" y="40" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Explore</text></g>
<g class="node c-purple" onclick="sendPrompt('How do I choose a model?')"><rect x="415" y="40" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="465" y="62" text-anchor="middle" dominant-baseline="central">Model</text></g>
<g class="node c-purple" onclick="sendPrompt('How do I evaluate a model?')"><rect x="540" y="40" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="590" y="62" text-anchor="middle" dominant-baseline="central">Evaluate</text></g>
<line x1="143" y1="62" x2="162" y2="62" class="arr" marker-end="url(#arrow)"/>
<line x1="268" y1="62" x2="287" y2="62" class="arr" marker-end="url(#arrow)"/>
<line x1="393" y1="62" x2="412" y2="62" class="arr" marker-end="url(#arrow)"/>
<line x1="518" y1="62" x2="537" y2="62" class="arr" marker-end="url(#arrow)"/>
<rect class="c-teal" x="40" y="108" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="60" y="115" dominant-baseline="central">Data work</text>
<rect class="c-purple" x="150" y="108" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="170" y="115" dominant-baseline="central">Modeling work</text>
<text class="ts" x="640" y="115" text-anchor="end" dominant-baseline="central">&#8635; repeat until results hold up</text>
</svg>
</body></html>

body{background:transparent}
/* Shared surface for the gallery and the DSH widget. Tokens first, so a host
   can override them and every chart follows without a second stylesheet. */

:root {
  --vz-text: #1b1b19;
  --vz-dim: #5f5e5a;
  --vz-faint: #8a8782;
  --vz-line: #e4e2da;
  --vz-surface: #ffffff;
  --vz-page: #f7f6f2;
  --vz-accent: #2a78d6;
  --vz-radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --vz-text: #ecebe6;
    --vz-dim: #b5b3aa;
    --vz-faint: #8b897f;
    --vz-line: #35342f;
    --vz-surface: #1c1c1a;
    --vz-page: #141413;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--vz-page);
  color: var(--vz-text);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Everything is selectable. A visualisation is a document, not an image. */
body, body * {
  user-select: text;
  -webkit-user-select: text;
}

a { color: var(--vz-accent); }

.vz-wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 96px;
}

.vz-head h1 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}

.vz-head p {
  color: var(--vz-dim);
  margin: 0 0 22px;
  max-width: 62ch;
}

.vz-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 0 0 26px;
  position: sticky;
  top: 0;
  padding: 12px 0;
  background: color-mix(in srgb, var(--vz-page) 88%, transparent);
  backdrop-filter: blur(8px);
  z-index: 5;
}

.vz-chip, .vz-button {
  font: inherit;
  font-size: 12px;
  padding: 5px 11px;
  border-radius: 999px;
  border: 1px solid var(--vz-line);
  background: var(--vz-surface);
  color: var(--vz-dim);
  cursor: pointer;
  transition: border-color .12s ease, color .12s ease, background .12s ease;
}

.vz-chip:hover, .vz-button:hover { color: var(--vz-text); border-color: var(--vz-dim); }
.vz-chip[aria-pressed="true"] { background: var(--vz-text); color: var(--vz-surface); border-color: var(--vz-text); }
.vz-button { border-radius: 7px; }

.vz-search {
  font: inherit;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--vz-line);
  background: var(--vz-surface);
  color: var(--vz-text);
  min-width: 200px;
}

.vz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  gap: 20px;
}

@media (max-width: 520px) {
  .vz-grid { grid-template-columns: 1fr; }
  .vz-wrap { padding: 24px 14px 64px; }
}

.vz-card {
  background: var(--vz-surface);
  border: 1px solid var(--vz-line);
  border-radius: var(--vz-radius);
  padding: 18px 18px 14px;
  min-width: 0;
  content-visibility: auto;
  contain-intrinsic-size: 420px;
}

.vz-card > h2 {
  font-size: 15px;
  font-weight: 500;
  margin: 0 0 2px;
}

.vz-card > .vz-when {
  color: var(--vz-dim);
  font-size: 12.5px;
  margin: 0 0 16px;
  max-width: 60ch;
}

.vz-plot { min-height: 120px; }

.vz-code {
  margin: 14px 0 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--vz-text) 5%, var(--vz-surface));
  color: var(--vz-dim);
  font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, monospace;
  font-size: 11.5px;
  line-height: 1.5;
  overflow: auto;
  max-height: 320px;
  white-space: pre;
  tab-size: 2;
}

.vz-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}

.vz-family {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--vz-faint);
  margin: 0 0 6px;
}

/* The same tokens the kit reads, expressed for a host that already has a theme. */
[data-vz="widget"] {
  --vz-text: var(--dsw-alias-label-primary, #1b1b19);
  --vz-dim: var(--dsw-alias-label-secondary, #5f5e5a);
  --vz-faint: var(--dsw-alias-label-tertiary, #8a8782);
  --vz-line: var(--dsw-alias-border-l2, #e4e2da);
  --vz-surface: var(--dsw-alias-bg-layer-1, #fff);
  --vz-page: transparent;
}

:root{--vz-text:var(--text);--vz-dim:var(--text-2);--vz-faint:var(--muted);--vz-line:var(--border);--vz-surface:var(--surface);--vz-accent:var(--accent);--grid:var(--border);--axis:var(--border-strong);--card:var(--surface-2)}
</style>

<div class="wrap" style="padding:4px 0 8px"><h2 class="sr-only">A number line from 2% to 8%: expected 5.17%, observed 4.75%, with ±1 and ±2 wobble bands.</h2>
<svg viewBox="0 0 680 220" role="img" aria-labelledby="nl-title nl-desc">
  <title id="nl-title">Typical random wobble</title>
  <desc id="nl-desc">The expected share is 5.17%, the observed share 4.75%. The dark band is ±1 wobble (4.06 to 6.28%); the light band is ±2 (2.95 to 7.39%).</desc>
  <text x="340" y="18" text-anchor="middle" font-family="var(--font-sans)" font-size="13" fill="var(--text-2)">typical random wobble</text>
  <rect x="60" y="34" width="560" height="64" rx="10" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1"/>
  <rect x="150.7" y="34" width="278.7" height="64" fill="var(--border)"/>
  <rect x="215.3" y="34" width="207.2" height="64" fill="var(--accent)" opacity="0.55"/>
  <rect x="60" y="34" width="560" height="64" rx="10" fill="none" stroke="var(--border-strong)" stroke-width="1"/>
  <line x1="355.9" y1="30" x2="355.9" y2="102" stroke="var(--text)" stroke-width="2"/>
  <circle cx="316.7" cy="66" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="60" y1="112" x2="620" y2="112" stroke="var(--border-strong)" stroke-width="1"/>
  <g font-family="var(--font-sans)" font-size="12" fill="var(--muted)">
    <text x="60" y="130" text-anchor="middle">2%</text>
    <text x="153.3" y="130" text-anchor="middle">3%</text>
    <text x="246.7" y="130" text-anchor="middle">4%</text>
    <text x="340" y="130" text-anchor="middle">5%</text>
    <text x="433.3" y="130" text-anchor="middle">6%</text>
    <text x="526.7" y="130" text-anchor="middle">7%</text>
    <text x="620" y="130" text-anchor="middle">8%</text>
  </g>
  <g font-family="var(--font-sans)" font-size="12" fill="var(--text-2)">
    <circle cx="66" cy="150" r="3.5" fill="var(--text)"/>
    <text x="78" y="154">Black line = the share the normal curve predicts (5.17%)</text>
    <circle cx="66" cy="172" r="3.5" fill="var(--accent)"/>
    <text x="78" y="176">Orange dot = the share actually counted in the data (4.75%)</text>
    <circle cx="66" cy="194" r="3.5" fill="var(--border-strong)"/>
    <text x="78" y="198">Dark band = ±1 wobble (4.06 to 6.28%)</text>
    <circle cx="66" cy="214" r="3.5" fill="var(--border)"/>
    <text x="78" y="218">Light band = ±2 wobbles (2.95 to 7.39%)</text>
  </g>
</svg></div>
<script>/**
 * viz-kit — the small, dependency-free layer every visual in this repo uses.
 *
 * It is deliberately boring: scales, axes, a tooltip, pointer dragging, an
 * animation loop, and theme tokens. Interaction lives here so a recipe never
 * re-implements "hover shows the value" or "drag rotates the scene".
 *
 * Works as a browser global (window.VK), in Node (module.exports) and inside the
 * DSH widget iframe, where the whole file is inlined.
 */
(function (root, factory) {
  const api = factory()
  if (typeof module === 'object' && module.exports) module.exports = api
  root.VK = api
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict'

  /* ------------------------------------------------------------------ tokens */

  // Fixed order, never re-ordered per chart: series 3 is always aqua.
  const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948']

  const FONT = 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'

  /**
   * Read a theme token with a light-mode fallback, so the same recipe renders on
   * a dark app surface and on a white page.
   * @param {Element} [host] element to read computed styles from
   * @returns {{text:string, dim:string, faint:string, line:string, surface:string, accent:string}}
   */
  function theme(host) {
    const read = (name, fallback) => {
      try {
        const el = host instanceof Element ? host : document.documentElement
        const value = getComputedStyle(el).getPropertyValue(name).trim()
        if (value !== '') return value
      } catch {
        /* no DOM, or the token is absent */
      }
      return fallback
    }
    return {
      text: read('--vz-text', read('--dsw-alias-label-primary', '#1b1b19')),
      dim: read('--vz-dim', read('--dsw-alias-label-secondary', '#5f5e5a')),
      faint: read('--vz-faint', read('--dsw-alias-label-tertiary', '#8a8782')),
      line: read('--vz-line', read('--dsw-alias-border-l2', '#e4e2da')),
      surface: read('--vz-surface', read('--dsw-alias-bg-layer-1', '#ffffff')),
      accent: read('--vz-accent', '#2a78d6'),
    }
  }

  /* ------------------------------------------------------------------ numbers */

  /**
   * Round for display and add thousands separators when useful.
   * @param {number} value
   * @param {number} [digits] fixed decimals; omit for automatic
   * @returns {string}
   */
  function fmt(value, digits) {
    if (!Number.isFinite(value)) return '—'
    const abs = Math.abs(value)
    if (digits !== undefined) return value.toFixed(digits)
    if (abs >= 1e9) return `${(value / 1e9).toFixed(1)}B`
    if (abs >= 1e6) return `${(value / 1e6).toFixed(1)}M`
    if (abs >= 1e4) return `${(value / 1e3).toFixed(1)}k`
    if (abs >= 100) return String(Math.round(value))
    if (abs >= 1) return String(Math.round(value * 10) / 10)
    if (abs === 0) return '0'
    return String(Math.round(value * 100) / 100)
  }

  /**
   * A small deterministic generator, so every reload draws the same picture.
   * @param {number} seed
   * @returns {() => number} values in [0, 1)
   */
  function rng(seed) {
    let s = seed >>> 0
    return () => {
      s = (s * 1664525 + 1013904223) % 4294967296
      return s / 4294967296
    }
  }

  /**
   * Box-Muller normal sample.
   * @param {() => number} random
   * @returns {number}
   */
  function normal(random) {
    const u = Math.max(random(), 1e-9)
    const v = random()
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v))
  const lerp = (a, b, t) => a + (b - a) * t
  const sum = (values) => values.reduce((a, b) => a + b, 0)
  const extent = (values) => [Math.min(...values), Math.max(...values)]

  /**
   * Evenly spaced, human-round ticks.
   * @param {number} lo
   * @param {number} hi
   * @param {number} count target count
   * @returns {number[]}
   */
  function ticks(lo, hi, count) {
    if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi === lo) return [lo]
    const raw = (hi - lo) / Math.max(1, count)
    const mag = Math.pow(10, Math.floor(Math.log10(raw)))
    const norm = raw / mag
    const step = (norm >= 7.5 ? 10 : norm >= 3.5 ? 5 : norm >= 1.5 ? 2 : 1) * mag
    const out = []
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(Math.round(v / step) * step)
    return out
  }

  /* ------------------------------------------------------------------- scales */

  /**
   * Continuous scale.
   * @param {[number, number]} domain
   * @param {[number, number]} range
   * @returns {((v:number)=>number) & {invert:(p:number)=>number, domain:[number,number], range:[number,number], ticks:(n?:number)=>number[]}}
   */
  function linear(domain, range) {
    const [d0, d1] = domain
    const [r0, r1] = range
    const span = d1 - d0 || 1
    const fn = (v) => r0 + ((v - d0) / span) * (r1 - r0)
    fn.invert = (p) => d0 + ((p - r0) / (r1 - r0 || 1)) * span
    fn.domain = [d0, d1]
    fn.range = [r0, r1]
    fn.ticks = (n = 5) => ticks(d0, d1, n)
    return fn
  }

  /**
   * Discrete band scale.
   * @param {readonly string[]} keys
   * @param {[number, number]} range
   * @param {number} [padding] 0..0.9
   */
  function band(keys, range, padding = 0.22) {
    const [r0, r1] = range
    const step = (r1 - r0) / Math.max(1, keys.length)
    const bw = step * (1 - padding)
    const index = new Map(keys.map((k, i) => [k, i]))
    const fn = (key) => r0 + (index.get(key) ?? 0) * step + (step - bw) / 2
    fn.bw = bw
    fn.step = step
    fn.keys = keys
    fn.index = (key) => index.get(key) ?? -1
    return fn
  }

  /* ---------------------------------------------------------------------- DOM */

  const SVG_NS = 'http://www.w3.org/2000/svg'

  /**
   * Create an element and set attributes in one call.
   * @param {string} tag
   * @param {Record<string, unknown>} [attrs]
   * @param {Element} [parent]
   * @returns {any}
   */
  function el(tag, attrs, parent) {
    const node = tag === 'svg' || tag === 'g' || tag === 'path' || tag === 'text' || tag === 'line' || tag === 'rect' || tag === 'circle'
      ? document.createElementNS(SVG_NS, tag)
      : document.createElement(tag)
    if (attrs) {
      for (const [key, value] of Object.entries(attrs)) {
        if (value === undefined || value === null) continue
        if (key === 'text') node.textContent = String(value)
        else if (key === 'html') node.innerHTML = String(value)
        else if (key === 'style' && typeof value === 'object') Object.assign(node.style, value)
        else if (key === 'class') node.setAttribute('class', String(value))
        else node.setAttribute(key, String(value))
      }
    }
    if (parent) parent.appendChild(node)
    return node
  }

  /**
   * A responsive SVG stage with margins.
   * @param {Element} host
   * @param {{width?:number, height?:number, margin?:{t:number,r:number,b:number,l:number}, label?:string}} [options]
   */
  function stage(host, options = {}) {
    const width = options.width ?? 680
    const height = options.height ?? 300
    const m = options.margin ?? { t: 18, r: 18, b: 34, l: 46 }
    host.innerHTML = ''
    const svg = el('svg', {
      viewBox: `0 0 ${width} ${height}`,
      width: '100%',
      height,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img',
      'aria-label': options.label ?? 'chart',
      style: { display: 'block', overflow: 'visible', fontFamily: FONT },
    }, host)
    const g = el('g', {}, svg)
    return {
      svg,
      g,
      W: width,
      H: height,
      m,
      pw: width - m.l - m.r,
      ph: height - m.t - m.b,
      x0: m.l,
      y0: m.t,
    }
  }

  /**
   * Horizontal grid plus value labels on the left axis.

        y: st.y0 + st.ph + 18,

   * @param {Element} host

      'aria-label': spec.label,

    }, row)

    input.addEventListener('input', () => {
      const value = Number(input.value)
      out.textContent = (spec.format ?? fmt)(value)
      spec.onInput(value)
    })
    return row
  }

  /**
   * A clickable legend that toggles series.
   * @param {Element} host
   * @param {{name:string, color:string, on?:boolean}[]} entries
   * @param {(name:string, on:boolean)=>void} onChange
   * @returns {HTMLElement}
   */
  function legend(host, entries, onChange) {

        type: 'button',
        'aria-pressed': String(on),
        style: {
          display: 'inline-flex', alignItems: 'center', gap: '6px', border: '0', padding: '2px 4px',
          background: 'none', cursor: 'pointer', color: 'var(--vz-dim, #5f5e5a)', fontSize: '12px',

    PALETTE, FONT, theme, fmt, rng, normal, clamp, lerp, sum, extent, ticks,
    linear, band, el, stage, gridY, axisX, axisXLinear,
    tip, drag, loop, onResize, slider, legend, mix, ramp,
  }
})

<script>/**
 * viz3d — canvas 2D with hand-written 3D maths.
 *
 * No WebGL, no Three.js: a rotation matrix, a perspective divide, a drag
 * handler and a frame loop. Small enough to inline in one widget, fast enough
 * for a few thousand points on a laptop.

   * Rotate a point around X then Y.

   * @param {number} ay radians around Y
   * @returns {[number,number,number]}
   */
  function rot([x, y, z], ax, ay) {
    const cy = Math.cos(ay)
    const sy = Math.sin(ay)
    const cx = Math.cos(ax)
    const sx = Math.sin(ax)
    const x1 = x * cy + z * sy
    const z1 = -x * sy + z * cy
    const y2 = y * cx - z1 * sx
    const z2 = y * sx + z1 * cx
    return [x1, y2, z2]
  }

   * Perspective projection into a W×H canvas.
   * @param {[number,number,number]} p
   * @param {number} w

   * @param {number} [depth]
   * @returns {[number, number, number]} screen x, screen y, scale
   */

    return [w / 2 + x * k, h / 2 + y * k, k / focal]
  }

   * @param {Element} host
   * @param {number} w logical width
   * @param {number} h logical height

    const cv = document.createElement('canvas')
    const dpr = Math.min(2, (typeof devicePixelRatio === 'number' ? devicePixelRatio : 1) || 1)
    cv.width = Math.round(w * dpr)
    cv.height = Math.round(h * dpr)
    cv.style.width = '100%'
    cv.style.height = `${h}px`
    cv.style.display = 'block'
    cv.style.touchAction = 'none'
    cv.setAttribute('role', 'img')
    const ctx = cv.getContext('2d')
    ctx.scale(dpr, dpr)
    host.appendChild(cv)
    return { cv, ctx, w, h, dpr }

   * One-finger orbit: horizontal drag turns, vertical drag tilts.
   * @param {Element} node
   * @param {{ax:number, ay:number, spin?:boolean}} state
   * @param {{onChange?:()=>void}} [options]
   */
  function orbit(node, state, options = {}) {

    let last = [0, 0]
    let idle = 0
    const down = (event) => {
      dragging = true
      last = [event.clientX, event.clientY]
      node.setPointerCapture?.(event.pointerId)
      if ('spin' in state) state.spin = false
      idle = 0
    }
    const move = (event) => {
      if (!dragging) return
      const dx = event.clientX - last[0]
      const dy = event.clientY - last[1]
      last = [event.clientX, event.clientY]
      state.ay += dx * 0.008
      state.ax = Math.max(-1.35, Math.min(1.35, state.ax + dy * 0.006))
      options.onChange?.()
      event.preventDefault()
    }
    const up = (event) => {
      dragging = false
      node.releasePointerCapture?.(event.pointerId)
    }
    node.addEventListener('pointerdown', down)
    node.addEventListener('pointermove', move)
    node.addEventListener('pointerup', up)
    node.addEventListener('pointercancel', up)
    node.style.cursor = 'grab'
    return () => {
      node.removeEventListener('pointerdown', down)
      node.removeEventListener('pointermove', move)
      node.removeEventListener('pointerup', up)
      node.removeEventListener('pointercancel', up)
    }
  }

  function hsl(h, s, l) {
    const hh = ((h % 360) + 360) % 360
    const ss = s / 100
    const ll = l / 100
    const a = ss * Math.min(ll, 1 - ll)
    const f = (n) => {
      const k = (n + hh / 30) % 12
      return Math.round(255 * (ll - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))))
    }
    return `rgb(${f(0)},${f(8)},${f(4)})`
  }

  return { rot, proj, canvas, orbit, hsl }

 * charts — one renderer, eleven chart types, every one interactive.
 *

 * draws it with hover readouts, click-to-pin, legend toggles, sliders and
